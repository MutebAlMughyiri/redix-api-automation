# Every API test against a fresh Go server built from redix-api's main: Dev, an empty database, the admin named below. On every push,
# nightly, and from Actions' Run workflow. The Extent report is kept as the run's artifact. Never qa (redix-api #117).
name: API tests

on:
  push:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      REDIX_ADMIN_USERNAME: ci-admin
      REDIX_ADMIN_PASSWORD: Ci-admin-passw0rd
      REDIX_ADMIN_NEW_PASSWORD: Ci-admin-chosen-1
      # The Dev server keeps each email in this folder instead of sending it; the tests read the codes from it (redix.support.Emails).
      REDIX_EMAIL_FOLDER: ${{ github.workspace }}/emails
    steps:
      - uses: actions/checkout@v7
        with:
          path: redix-api-automation
      - uses: actions/checkout@v7
        with:
          repository: MutebAlMughyiri/redix-api
          path: redix-api
      - uses: actions/setup-go@v5
        with:
          go-version-file: redix-api/go-backend/go.mod
          cache-dependency-path: redix-api/go-backend/go.sum
      - name: Start the API, which brings its database up to date as it starts
        working-directory: redix-api/go-backend
        run: |
          curl -sSfL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          export REDIX_Typst__Path="$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst"
          # The admin's password is the environment's own, REDIX_Dev_Admin__Password (redix-api #118).
          export REDIX_Environment=Dev REDIX_Admin__Username="$REDIX_ADMIN_USERNAME" REDIX_Dev_Admin__Password="$REDIX_ADMIN_PASSWORD"
          mkdir -p "$REDIX_EMAIL_FOLDER"
          # Every test asks from this one address, so the per-caller limits are raised; the per-login limit stays, and is tested.
          export REDIX_Email__Folder="$REDIX_EMAIL_FOLDER" REDIX_EmailCodes__PermitsPerHour=100000 REDIX_Registration__PermitsPerHour=100000
          export REDIX_Jwt__SigningKey="$(openssl rand -base64 64 | tr -d '\n')" REDIX_Database__Path="$RUNNER_TEMP/RedixDev.db"
          go build -o "$RUNNER_TEMP/redix-server" ./cmd/server
          nohup "$RUNNER_TEMP/redix-server" > "$RUNNER_TEMP/api.log" 2>&1 &
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: redix-api-automation/pom.xml
      - run: mvn -B test
        working-directory: redix-api-automation
      - name: The Extent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: redix-api-automation/target/extent-report
          if-no-files-found: ignore
      - name: The API's log, when a run fails
        if: failure()
        run: cat "$RUNNER_TEMP/api.log"
